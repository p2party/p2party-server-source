# ============================================================================
# p2party release rehearsal: Ansible configuration
# ============================================================================
# run.sh sets ANSIBLE_CONFIG to this file, so neither the operator's
# deploy/ansible/ansible.cfg nor ~/.ansible.cfg is read. It keeps the settings
# of deploy/ansible/ansible.cfg.example that change how a playbook runs
# (pipelining, become, output format) and drops the operator-specific ones
# (inventory, key, vault identity, log path). Paths that depend on the run
# (key, known_hosts, control sockets, collections, temporary files) come from
# run.sh's environment.
# ============================================================================

[defaults]
host_key_checking = True
retry_files_enabled = False
timeout = 30
forks = 10
stdout_callback = ansible.builtin.default
result_format = yaml
interpreter_python = /usr/bin/python3

[ssh_connection]
pipelining = True
# -F /dev/null: no ~/.ssh/config entry can redirect the connection.
ssh_args = -F /dev/null -o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=no -o IdentitiesOnly=yes -o BatchMode=yes
retries = 3
timeout = 30

[privilege_escalation]
become = False
become_method = sudo
become_user = root
become_ask_pass = False
