---
# ============================================================================
# Deploy the protocol-v4 signaling server
# ============================================================================
# Ported from the older `server` repo's playbook, with the parts that no
# longer describe this server removed rather than carried along:
#
#   * The binary is built from THIS repo (`bun run build:linux` →
#     deploy/ansible/builds/p2party_linux_x64), so the deploy can never ship a
#     different repo's server than the one you tested.
#   * Postgres migrations run on every deploy via `prisma migrate deploy`,
#     which applies only pending migrations and never resets anything. The
#     signaling host reaches Postgres over the private network (10.231.0.0/24);
#     5432 is not exposed publicly.
#
# Usage:
#   ansible-playbook -i inventory/production.yml playbooks/deploy.yml
#   ansible-playbook ... -e "skip_build=true"          # ship an existing binary
# ============================================================================
- name: Provision verified PostgreSQL TLS
  import_playbook: postgres-tls.yml

- name: Deploy p2party signaling server
  hosts: signaling_production
  become: true
  # With several hosts, one whose worker could not be stopped must stop the
  # whole play: the migration may not run while any worker anywhere serves.
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all/vars.yml"
    - "{{ playbook_dir }}/../group_vars/production/vars.yml"
    - "{{ playbook_dir }}/../group_vars/all/vault.yml"

  vars:
    repo_path: "{{ playbook_dir }}/../../.."
    build_command: "bun run build:linux"
    # Built by `bun run build:linux` into deploy/ansible/builds/, so the
    # artefact lives beside the playbook that ships it rather than loose in
    # the repository root.
    binary_name: deploy/ansible/builds/p2party_linux_x64
    # Tooling is isolated from the compiled service and installed from the same
    # manifest/lockfile that passed the release audit, including security overrides.
    migration_tooling: "{{ app.home }}/server/migration-tooling"
    # The new binary, environment and units wait here until the migration has
    # succeeded. Root-only; nothing reads it but the install tasks.
    release_staging: "{{ app.home }}/server/release-staging"
    # A failed migration writes Prisma's output here (root-only, password
    # removed) and leaves the marker that initial-setup.yml checks.
    migration_log: /var/log/p2party-migration-failure.log
    migration_failure_marker: /var/lib/p2party-migration-failed
    deploy_interrupted: |
      A deploy stopped every signaling worker and then ended before it had
      installed the new binary: the schema may be ahead of the binary on disk.
      Do not start that binary, and do not run initial-setup.yml (it refuses
      to enable or start a signaling unit while this file exists). Run
      deploy/deploy.sh again; if its migration fails, follow the steps it
      prints (deploy/README.md, "A failed or interrupted migration").
    migration_recovery: |
      The PostgreSQL migration failed or was interrupted. Every signaling
      worker is stopped and disabled and the previous binary is still in
      place, so nothing serves until this is resolved.

      Recover (deploy/README.md, "A failed or interrupted migration"):
      1. Read why it failed in {{ migration_log }} (root only) on the
         signaling host and, when Prisma recorded a failed migration, in its
         row of "_prisma_migrations" ("logs" column).
      2. Fix the cause: a lock another session held, the database
         unreachable, a full disk.
      3. From {{ app.home }}/server as {{ app.user }}, with DATABASE_URL set
         as this play sets it, run `migrate status`:
         {{ app.home }}/.bun/bin/bun {{ migration_tooling }}/node_modules/prisma/build/index.js migrate status
         If it names a failed migration, mark it rolled back with the same
         command and `migrate resolve --rolled-back <migration name>`. Every
         migration of this release can run again after a failure at any
         statement. If it names none (the database was unreachable before a
         migration started), there is nothing to resolve.
      4. Run this playbook again. It applies the migration and only then
         installs and starts the new binary.
      Until then, do not run initial-setup.yml (it refuses to enable or start
      a signaling unit while {{ migration_failure_marker }} exists) and do not
      start the previous binary: rolling it back after
      20261127000000_rekey_peers_to_derived_ids is not supported.
    # Read the same package.json that bun build embeds through src/version.ts.
    # A skip-build deploy of an older binary therefore fails the health gate
    # instead of silently announcing a version different from the source tree.
    expected_server_version: >-
      {{ (lookup('ansible.builtin.file', repo_path ~ '/package.json')
          | from_json).version }}

  tasks:
    # ------------------------------------------------------------------
    # Build locally, from this repo
    # ------------------------------------------------------------------
    # Both run on the control machine, not the target. `become: false` alone is
    # not enough: the inventory sets ansible_become: true, and that connection
    # variable outranks the task keyword — so each also needs the variable
    # cleared, or ansible tries to sudo locally and stops for a password.
    - name: Build the Linux binary from this repo
      shell: cd "{{ repo_path }}" && {{ build_command }}
      delegate_to: localhost
      become: false
      vars:
        ansible_become: false
      register: build_result
      changed_when: true
      when: not (skip_build | default(false) | bool)

    - name: Confirm the binary exists before touching the host
      stat:
        path: "{{ repo_path }}/{{ binary_name }}"
      delegate_to: localhost
      become: false
      vars:
        ansible_become: false
      register: built_binary

    - name: Fail early when there is nothing to deploy
      assert:
        that: built_binary.stat.exists
        fail_msg: >-
          {{ binary_name }} not found in {{ repo_path }}. Run
          `{{ build_command }}` first, or drop skip_build.

    - name: Resolve the desired signaling instance ports
      set_fact:
        signaling_instance_ports: >-
          {{ signaling_ports
             | default([app_port]) }}

    # ------------------------------------------------------------------
    # Prepare the release while the old one keeps serving
    # ------------------------------------------------------------------
    # Everything that can fail without touching the database happens here,
    # before any worker is stopped: the journal drop-in, the migration tooling
    # (a registry fetch), the schema and migrations, and the new binary, its
    # environment file, its units and the Caddy configuration, all staged
    # under {{ release_staging }} or as a candidate file. Nothing the running
    # workers read is changed. A failure here ends the play with production
    # still running the previous release, untouched.
    - name: Prepare the release without touching the running workers
      block:
        - name: Ensure the journald drop-in directory exists
          file:
            path: /etc/systemd/journald.conf.d
            state: directory
            owner: root
            group: root
            mode: "0755"

        # The signaling workers and Caddy log to the journal. This bounds the
        # journal only; nothing in this repository configures rsyslog, so
        # whether the host also copies the journal into syslog files must be
        # checked there.
        - name: Keep the journal for at most seven days
          template:
            src: "{{ playbook_dir }}/../templates/journald-retention.conf.j2"
            dest: /etc/systemd/journald.conf.d/p2party-retention.conf
            owner: root
            group: root
            mode: "0644"
          notify: Restart journald

        - name: Ensure the server directory exists
          file:
            path: "{{ app.home }}/server"
            state: directory
            owner: "{{ app.user }}"
            group: "{{ app.group }}"
            mode: "0755"

        # Tooling is installed from the same manifest and lockfile as the
        # release, including its security overrides.
        - name: Create an isolated directory for audited migration tooling
          file:
            path: "{{ migration_tooling }}"
            state: directory
            owner: "{{ app.user }}"
            group: "{{ app.group }}"
            mode: "0755"

        - name: Copy the audited package manifest and frozen dependency lock
          copy:
            src: "{{ repo_path }}/{{ item }}"
            dest: "{{ migration_tooling }}/{{ item }}"
            owner: "{{ app.user }}"
            group: "{{ app.group }}"
            mode: "0644"
          loop: [package.json, bun.lock]

        - name: Install exactly the audited migration dependencies
          become_user: "{{ app.user }}"
          command:
            argv:
              - "{{ app.home }}/.bun/bin/bun"
              - install
              - --frozen-lockfile
            chdir: "{{ migration_tooling }}"
          environment:
            NODE_ENV: development

        - name: Ensure the prisma directory exists
          file:
            path: "{{ app.home }}/server/prisma"
            state: directory
            owner: "{{ app.user }}"
            group: "{{ app.group }}"
            mode: "0755"

        - name: Copy the schema
          copy:
            src: "{{ repo_path }}/prisma/schema.prisma"
            dest: "{{ app.home }}/server/prisma/schema.prisma"
            owner: "{{ app.user }}"
            group: "{{ app.group }}"
            mode: "0644"

        - name: Copy the migrations
          copy:
            src: "{{ repo_path }}/prisma/migrations/"
            dest: "{{ app.home }}/server/prisma/migrations/"
            owner: "{{ app.user }}"
            group: "{{ app.group }}"
            mode: "0644"
            directory_mode: "0755"

        # Prisma 7 removed `url` from the datasource block, so the CLI reads
        # the connection string from prisma.config.ts. Without this file on the
        # host, `migrate deploy` has no datasource at all — the schema alone is
        # no longer enough.
        - name: Copy the Prisma config
          copy:
            src: "{{ repo_path }}/prisma.config.ts"
            dest: "{{ app.home }}/server/prisma.config.ts"
            owner: "{{ app.user }}"
            group: "{{ app.group }}"
            mode: "0644"

        - name: Ensure the release staging directory exists
          file:
            path: "{{ release_staging }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Stage the compiled binary
          copy:
            src: "{{ repo_path }}/{{ binary_name }}"
            dest: "{{ release_staging }}/p2party-server"
            owner: "{{ app.user }}"
            group: "{{ app.group }}"
            mode: "0755"

        # The binary and its environment are a matched pair: this release
        # requires COTURN_SECRET and a postgresql:// DATABASE_URL, and a binary
        # restarted against an older .env exits at startup. initial-setup.yml
        # also writes this file, but a deploy must not depend on someone having
        # re-run provisioning.
        - name: Stage the signaling environment file
          template:
            src: "{{ playbook_dir }}/../templates/signaling.env.j2"
            dest: "{{ release_staging }}/.env"
            owner: "{{ app.user }}"
            group: "{{ app.group }}"
            mode: "0600"
          # The rendered file contains both database and TURN credentials.
          # Keep an operator's --diff from copying either secret into the
          # Ansible log.
          diff: false

        # Same reasoning for the unit files. PORT is set here, per instance,
        # and a deploy that ships a new binary against stale units cannot fix
        # an ordering or environment bug in them — which is how every instance
        # ended up binding 3001 and dying with EADDRINUSE.
        - name: Stage the systemd unit files
          template:
            src: "{{ playbook_dir }}/../templates/p2party-signaling.service.j2"
            dest: "{{ release_staging }}/p2party-signaling-{{ item }}.service"
            owner: root
            group: root
            mode: "0644"
          loop: "{{ signaling_instance_ports }}"
          loop_control:
            label: "{{ item }}"
          vars:
            signaling_port: "{{ item }}"

        # Caddy must consume the exact same desired-port fact as the unit and
        # health tasks. The candidate is rendered and validated here; it is
        # installed only after the migration, before the workers start.
        - name: Render the candidate Caddy configuration
          template:
            src: "{{ playbook_dir }}/../templates/Caddyfile.j2"
            dest: /etc/caddy/Caddyfile.p2party-candidate
            owner: root
            group: root
            mode: "0644"

        # caddy validate runs as root and opens every log file the Caddyfile
        # names, creating a missing one as root with mode 0600, which the caddy
        # user then cannot open on reload. Every such file exists and belongs
        # to caddy before validation, and again after it.
        - name: Ensure Caddy's log directory belongs to caddy
          file:
            path: /var/log/caddy
            state: directory
            owner: caddy
            group: caddy
            mode: "0755"

        - name: Ensure Caddy's log files exist and belong to caddy
          file:
            path: "{{ item }}"
            state: touch
            owner: caddy
            group: caddy
            mode: "0600"
            modification_time: preserve
            access_time: preserve
          loop:
            - "/var/log/caddy/{{ domains.signaling }}.log"

        - name: Validate the candidate Caddy configuration
          command:
            argv:
              - caddy
              - validate
              - --config
              - /etc/caddy/Caddyfile.p2party-candidate
              - --adapter
              - caddyfile
          changed_when: false

        - name: Keep Caddy's log files owned by caddy after validation
          file:
            path: "{{ item }}"
            state: touch
            owner: caddy
            group: caddy
            mode: "0600"
            modification_time: preserve
            access_time: preserve
          loop:
            - "/var/log/caddy/{{ domains.signaling }}.log"
      rescue:
        - name: Check whether an earlier deploy left the service stopped
          stat:
            path: "{{ migration_failure_marker }}"
          register: earlier_interrupted_deploy

        - name: Report that preparing the release failed
          fail:
            msg: |
              Preparing the release failed before this run stopped any
              signaling worker or touched the database; nothing the running
              workers read was changed. The failed task is named above this
              message. Fix its cause (for example a registry fetch that failed
              during `bun install`) and run this playbook again.
              {% if earlier_interrupted_deploy.stat.exists %}
              But an earlier deploy had already stopped every worker and not
              finished ({{ migration_failure_marker }} exists): nothing is
              serving, and the steps in that file still apply.
              {% else %}
              Production is still running the previous release, untouched.
              {% endif %}

    # ------------------------------------------------------------------
    # Stop every worker before the schema changes
    # ------------------------------------------------------------------
    # No worker of the release being replaced may serve while migrations run,
    # and the new binary is put in place only after they have succeeded, so
    # that systemd can never start a binary against a schema it was not built
    # for. Every installed signaling unit is stopped and disabled: Restart=
    # always does not restart a stopped unit, and a disabled unit does not
    # start at boot. Clients are cut off until the new workers start; this
    # release accepts that downtime. The units are enabled again only by
    # "Restart signaling services", after the new binary is in place.
    - name: Discover the signaling units to stop before migrating
      find:
        paths: /etc/systemd/system
        # The exact base name is the legacy cloud-init unit.
        patterns:
          - "p2party-signaling.service"
          - "p2party-signaling-*.service"
        file_type: file
        recurse: false
      register: signaling_units_before_migration

    - name: Stop and disable every signaling worker before migrating
      systemd:
        name: "{{ item | basename }}"
        state: stopped
        enabled: false
      loop: >-
        {{ signaling_units_before_migration.files
           | map(attribute='path') | list }}
      loop_control:
        label: "{{ item | basename }}"

    # From here until the new binary is installed, the binary on disk may not
    # match the schema. initial-setup.yml refuses to enable or start a
    # signaling unit while this marker exists, and prints it; it is removed
    # only after the new binary, environment and units are in place.
    - name: Mark that the binary on disk may not match the schema
      copy:
        dest: "{{ migration_failure_marker }}"
        content: "{{ deploy_interrupted }}"
        owner: root
        group: root
        mode: "0600"

    # ------------------------------------------------------------------
    # Postgres schema — migrations are applied on every deploy
    # ------------------------------------------------------------------
    # `prisma migrate deploy` only applies migrations that have not run yet and
    # never generates or resets anything, so running it each time is how the
    # schema stays in step with the binary being shipped.
    - name: Apply Postgres migrations
      block:
        - name: Apply migrations against Postgres
          become_user: "{{ app.user }}"
          command:
            argv:
              - "{{ app.home }}/.bun/bin/bun"
              - "{{ migration_tooling }}/node_modules/prisma/build/index.js"
              - migrate
              - deploy
            chdir: "{{ app.home }}/server"
          environment:
            # Prisma's subprocesses need the same installed Bun; no shell profile
            # or globally installed Prisma package participates in this migration.
            PATH: "{{ app.home }}/.bun/bin:{{ ansible_facts['env'].PATH }}"
            DATABASE_URL: "postgresql://{{ database.user | urlencode }}:{{ database.password | urlencode }}@{{ database.host }}:{{ database.port }}/{{ database.name }}?schema=public&sslmode={{ database.ssl_mode }}&sslrootcert={{ database.ssl_root_cert }}"
          # The connection string exists only in this task's environment, so the
          # task is hidden from the Ansible log; a failure's output goes to
          # {{ migration_log }} instead (rescue below).
          no_log: true
          register: migration_result
          # A failed migration stops the deploy in the rescue below, before the
          # new binary is put in place.
          failed_when: migration_result.rc != 0
      rescue:
        # Prisma's own output, with the database password removed in case any
        # line quotes it, in a file only root can read.
        - name: Write the failed migration's output for the operator
          copy:
            dest: "{{ migration_log }}"
            content: >-
              {{ ((migration_result.stdout | default('')) ~ '\n'
                  ~ (migration_result.stderr | default(''))
                  ~ '\n' ~ (migration_result.msg | default('')))
                 | replace((database.password | urlencode) or '<no password>', '<redacted>')
                 | replace(database.password or '<no password>', '<redacted>') }}
            owner: root
            group: root
            mode: "0600"
          no_log: true

        # The marker set before the migration now says why.
        - name: Record in the marker that the migration failed
          copy:
            dest: "{{ migration_failure_marker }}"
            content: "{{ migration_recovery }}"
            owner: root
            group: root
            mode: "0600"

        - name: Report the failed migration and how to recover
          fail:
            msg: "{{ migration_recovery }}"

    # ------------------------------------------------------------------
    # Install the release, only once the schema matches it
    # ------------------------------------------------------------------
    - name: Install the staged binary
      copy:
        src: "{{ release_staging }}/p2party-server"
        dest: "{{ app.home }}/server/p2party-server"
        remote_src: true
        owner: "{{ app.user }}"
        group: "{{ app.group }}"
        mode: "0755"

    - name: Install the staged signaling environment file
      copy:
        src: "{{ release_staging }}/.env"
        dest: "{{ app.home }}/server/.env"
        remote_src: true
        owner: "{{ app.user }}"
        group: "{{ app.group }}"
        mode: "0600"
      diff: false

    # No notify: the restart task below already passes daemon_reload, so a
    # handler here would be a second way to do the same thing and a runtime
    # error if it were ever renamed.
    - name: Install the staged systemd unit files
      copy:
        src: "{{ release_staging }}/p2party-signaling-{{ item }}.service"
        dest: "/etc/systemd/system/p2party-signaling-{{ item }}.service"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop: "{{ signaling_instance_ports }}"
      loop_control:
        label: "{{ item }}"

    - name: Remove the marker now that the binary matches the schema
      file:
        path: "{{ migration_failure_marker }}"
        state: absent

    # ------------------------------------------------------------------
    # Cut public routing over, start, and verify
    # ------------------------------------------------------------------
    # Narrow routing before the start so a breaking wire release cannot
    # alternate between an obsolete worker and the new one.
    - name: Atomically install the validated Caddy configuration
      command:
        argv:
          - mv
          - -f
          - --
          - /etc/caddy/Caddyfile.p2party-candidate
          - /etc/caddy/Caddyfile

    - name: Reload Caddy onto the desired signaling ports
      systemd:
        name: caddy
        state: reloaded

    - name: Restart signaling services
      systemd:
        name: "p2party-signaling-{{ item }}"
        state: restarted
        enabled: true
        daemon_reload: true
      loop: "{{ signaling_instance_ports }}"
      loop_control:
        label: "{{ item }}"

    - name: Wait for signaling services to be healthy
      block:
        - name: Wait for each instance to accept connections
          wait_for:
            port: "{{ item }}"
            host: 127.0.0.1
            delay: 3
            timeout: 25
          loop: "{{ signaling_instance_ports }}"
          loop_control:
            label: "{{ item }}"
      rescue:
        # A dead unit never opens its port, so without this the play spends
        # 25s per instance timing out and then reports only "Timeout", which
        # says nothing about why. The service log always does.
        - name: Collect why the service did not start
          shell: |
            systemctl status p2party-signaling-{{ signaling_instance_ports | first }} --no-pager -l | tail -20
            echo '--- journal ---'
            journalctl -u p2party-signaling-{{ signaling_instance_ports | first }} -n 40 --no-pager
          register: signaling_failure
          changed_when: false
          failed_when: false

        - name: Report the service failure
          fail:
            msg: |
              The signaling service did not start. Its own log follows.

              Most likely: COTURN_SECRET missing or under 32 bytes, the
              database unreachable or not answering, or a database schema this
              build was not made for. For both database cases the server exits
              within 10s with one "p2party: refusing to start" line saying what
              it found and what to run (a startup re-key that runs past its own
              60s bound is reported the same way).

              {{ signaling_failure.stdout | default('no output captured') }}

    # Probe every direct worker rather than sampling through Caddy. A mixed
    # rollout is unsafe for clients that require room request correlation, and
    # a TCP accept alone cannot distinguish the new binary from the old one.
    - name: Read health from every signaling instance
      uri:
        url: "http://127.0.0.1:{{ item }}/health"
        method: GET
        return_content: true
        status_code: 200
      loop: "{{ signaling_instance_ports }}"
      loop_control:
        label: "{{ item }}"
      register: signaling_health

    - name: Verify every signaling instance reports the expected build
      assert:
        that:
          - item.json.status == "ok"
          - item.json.protocolVersion == 4
          - item.json.version == expected_server_version
          - item.json.serverId is string
          - (item.json.serverId | trim | length) > 0
        fail_msg: >-
          Signaling port {{ item.item }} reported an unexpected health payload:
          {{ item.content | default('no response body') }}
      loop: "{{ signaling_health.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Collect signaling instance identifiers
      set_fact:
        signaling_server_ids: >-
          {{ signaling_health.results
             | map(attribute='json.serverId')
             | list }}

    - name: Verify every signaling port belongs to a distinct process
      assert:
        that:
          - >-
            (signaling_server_ids | unique | length)
            == (signaling_instance_ports | length)
        fail_msg: >-
          Expected {{ signaling_instance_ports | length }} distinct signaling
          processes but received server ids {{ signaling_server_ids }}.

    # Caddy no longer routes new requests to obsolete ports. Retire their units
    # only after every desired process has passed the exact direct health gate,
    # leaving one ordering for both a scale-down and an ordinary release.
    - name: Build the desired signaling unit path list
      set_fact:
        desired_signaling_unit_paths: >-
          {{ signaling_instance_ports
             | map('string')
             | map('regex_replace', '^', '/etc/systemd/system/p2party-signaling-')
             | map('regex_replace', '$', '.service')
             | list }}
      changed_when: false

    - name: Discover installed signaling unit files
      find:
        paths: /etc/systemd/system
        # The exact base name is the legacy cloud-init unit. Include it
        # explicitly: the hyphenated pattern alone does not match it.
        patterns:
          - "p2party-signaling.service"
          - "p2party-signaling-*.service"
        file_type: file
        recurse: false
      register: installed_signaling_units

    - name: Resolve obsolete signaling unit files
      set_fact:
        obsolete_signaling_unit_paths: >-
          {{ installed_signaling_units.files
             | map(attribute='path')
             | difference(desired_signaling_unit_paths)
             | list }}
      changed_when: false

    - name: Stop and disable obsolete signaling services
      systemd:
        name: "{{ item | basename }}"
        state: stopped
        enabled: false
      loop: "{{ obsolete_signaling_unit_paths }}"
      loop_control:
        label: "{{ item | basename }}"

    - name: Remove obsolete signaling unit files
      file:
        path: "{{ item }}"
        state: absent
      loop: "{{ obsolete_signaling_unit_paths }}"
      loop_control:
        label: "{{ item | basename }}"

    - name: Reload systemd after retiring obsolete signaling services
      systemd:
        daemon_reload: true
      when: (obsolete_signaling_unit_paths | length) > 0

    - name: Read public signaling health through Caddy
      uri:
        url: "https://{{ domains.signaling }}/health"
        method: GET
        return_content: true
        status_code: 200
        use_proxy: false
        validate_certs: true
      register: public_signaling_health

    - name: Verify Caddy exposes only the expected signaling build
      assert:
        that:
          - public_signaling_health.json.status == "ok"
          - public_signaling_health.json.protocolVersion == 4
          - public_signaling_health.json.version == expected_server_version
          - public_signaling_health.json.serverId in signaling_server_ids
        fail_msg: >-
          Public signaling health reported an unexpected payload after cutover:
          {{ public_signaling_health.content | default('no response body') }}

    - name: Deployment complete
      debug:
        msg: >-
          p2party signaling server {{ expected_server_version }} deployed to
          {{ inventory_hostname }} on {{ signaling_instance_ports | length }}
          verified workers

  handlers:
    # journald re-reads its configuration only on restart. Since systemd 230 it
    # keeps services' stdout streams across a restart in its file descriptor
    # store, so the workers keep logging.
    - name: Restart journald
      systemd:
        name: systemd-journald
        state: restarted
