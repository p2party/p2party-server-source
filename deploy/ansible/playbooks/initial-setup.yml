# ============================================================================
# P2Party Initial Setup Playbook
# ============================================================================
# First-time setup for the signaling server after cloud-init provisioning.
# Installs Bun, deploys code, configures Caddy, creates services.
#
# Usage:
#   ansible-playbook -i inventory/production.yml playbooks/initial-setup.yml \
#     --vault-id production@vault_pass_production.sh
# ============================================================================
---
# The local pre-flight comes first: it checks this machine's ansible-core and
# Bun before any host is contacted (local-preflight.yml).
- name: Check this machine's toolchain before any host is contacted
  import_playbook: local-preflight.yml

- name: Provision verified PostgreSQL TLS
  import_playbook: postgres-tls.yml

# ============================================================================
# Pre-flight Health Check
# ============================================================================
- name: Pre-flight checks
  hosts: signaling_production
  gather_facts: true

  tasks:
    - name: Verify SSH connectivity
      ping:

    - name: Display target info
      debug:
        msg: "Setting up signaling server on {{ inventory_hostname }} ({{ ansible_host }})"

# ============================================================================
# Install Bun Runtime
# ============================================================================
- name: Install Bun on Signaling Server
  hosts: signaling_production
  become: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all/vars.yml"

  tasks:
    - name: Check if Bun is installed
      stat:
        path: "{{ app.home }}/.bun/bin/bun"
      register: bun_installed

    - name: Install Bun
      when: not bun_installed.stat.exists
      block:
        - name: Install unzip (required for Bun)
          apt:
            name: unzip
            state: present
            update_cache: yes

        - name: Install Bun via official installer
          shell: curl -fsSL https://bun.sh/install | bash
          become_user: "{{ app.user }}"

    - name: Verify Bun installation
      command: "{{ app.home }}/.bun/bin/bun --version"
      become_user: "{{ app.user }}"
      register: bun_version
      changed_when: false

    - name: Display Bun version
      debug:
        msg: "Bun {{ bun_version.stdout }} installed"

# ============================================================================
# Install Caddy
# ============================================================================
- name: Install Caddy Reverse Proxy
  hosts: signaling_production
  become: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all/vars.yml"
    - "{{ playbook_dir }}/../group_vars/production/vars.yml"

  tasks:
    - name: Install Caddy dependencies
      apt:
        name:
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
          - curl
        state: present
        update_cache: yes

    - name: Add Caddy GPG key
      shell: curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

    - name: Add Caddy repository
      shell: curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
      args:
        creates: /etc/apt/sources.list.d/caddy-stable.list

    - name: Install Caddy
      apt:
        name: caddy
        state: present
        update_cache: yes

    # caddy validate runs as root and opens every log file the Caddyfile names,
    # creating a missing one as root with mode 0600, which the caddy user then
    # cannot open on reload. Every such file exists and belongs to caddy before
    # validation, and again after it.
    - name: Ensure Caddy's log directory belongs to caddy
      file:
        path: /var/log/caddy
        state: directory
        owner: caddy
        group: caddy
        mode: "0755"

    - name: Ensure Caddy's log files exist and belong to caddy
      file:
        path: "{{ item }}"
        state: touch
        owner: caddy
        group: caddy
        mode: "0600"
        modification_time: preserve
        access_time: preserve
      loop:
        - "/var/log/caddy/{{ domains.signaling }}.log"

    # The rendered file is checked before it replaces the running one: a
    # Caddyfile that fails validation fails the play and leaves Caddy as it is.
    - name: Deploy Caddyfile
      template:
        src: "{{ playbook_dir }}/../templates/Caddyfile.j2"
        dest: /etc/caddy/Caddyfile
        owner: root
        group: root
        mode: "0644"
        validate: caddy validate --config %s --adapter caddyfile
      vars:
        signaling_instance_ports: "{{ signaling_ports | default([app_port]) }}"
      notify: Reload Caddy

    - name: Keep Caddy's log files owned by caddy after validation
      file:
        path: "{{ item }}"
        state: touch
        owner: caddy
        group: caddy
        mode: "0600"
        modification_time: preserve
        access_time: preserve
      loop:
        - "/var/log/caddy/{{ domains.signaling }}.log"

    - name: Enable Caddy
      systemd:
        name: caddy
        enabled: true
        state: started

  handlers:
    - name: Reload Caddy
      systemd:
        name: caddy
        state: reloaded

# ============================================================================
# Deploy Application Code
# ============================================================================
- name: Deploy Signaling Server Code
  hosts: signaling_production
  become: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all/vars.yml"
    - "{{ playbook_dir }}/../group_vars/production/vars.yml"
    - "{{ playbook_dir }}/../group_vars/all/vault.yml"

  vars:
    local_server_path: "{{ playbook_dir }}/../../.."
    # The same path as in deploy.yml (tests/deploy.contract.test.ts checks).
    migration_failure_marker: /var/lib/p2party-migration-failed

  tasks:
    - name: Create application directory
      file:
        path: "{{ app.home }}/server"
        state: directory
        owner: "{{ app.user }}"
        group: "{{ app.group }}"
        mode: "0755"

    # The signaling workers and Caddy log to the journal. This bounds the
    # journal only; nothing in this repository configures rsyslog, so whether
    # the host also copies the journal into syslog files must be checked there.
    - name: Ensure the journald drop-in directory exists
      file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Keep the journal for at most seven days
      template:
        src: "{{ playbook_dir }}/../templates/journald-retention.conf.j2"
        dest: /etc/systemd/journald.conf.d/p2party-retention.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart journald

    # Binary is deployed by deploy.yml playbook
    # This playbook sets up the environment and systemd services

    - name: Deploy .env file
      template:
        src: "{{ playbook_dir }}/../templates/signaling.env.j2"
        dest: "{{ app.home }}/server/.env"
        owner: "{{ app.user }}"
        group: "{{ app.group }}"
        mode: "0600"
      diff: false

    # Dependencies, Prisma client, and migrations handled by deploy.yml
    # Using compiled binary deployment - no npm install needed

    - name: Resolve the desired signaling instance ports
      set_fact:
        signaling_instance_ports: "{{ signaling_ports | default([app_port]) }}"

    # ========================================================================
    # Systemd Service
    # ========================================================================
    - name: Deploy systemd service files
      template:
        src: "{{ playbook_dir }}/../templates/p2party-signaling.service.j2"
        dest: "/etc/systemd/system/p2party-signaling-{{ item }}.service"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ signaling_instance_ports }}"
      loop_control:
        label: "{{ item }}"
      vars:
        signaling_port: "{{ item }}"
      notify: Reload systemd

    # This playbook provisions the host; playbooks/deploy.yml ships the binary.
    # On a first run the binary does not exist yet, so starting the units and
    # waiting for their ports can only time out after 60s per instance. Enable
    # them either way so a later deploy just starts them.
    - name: Check whether a server binary has been deployed yet
      stat:
        path: "{{ app.home }}/server/p2party-server"
      register: signaling_binary

    # deploy.yml leaves this marker from the moment it has stopped the workers
    # until the new binary is installed, and keeps it after a failed
    # migration: the binary on disk may then be older than the schema (after
    # the identity re-key, a 0.1.4 binary must never start). Nothing below
    # enables or starts a unit while it exists.
    - name: Check for a deploy that left the binary and schema out of step
      stat:
        path: "{{ migration_failure_marker }}"
      register: migration_failure_marker_file

    - name: Read the interrupted deploy's recovery steps
      slurp:
        src: "{{ migration_failure_marker }}"
      register: migration_failure_marker_text
      when: migration_failure_marker_file.stat.exists

    - name: Refuse to start signaling services after an interrupted deploy
      fail:
        msg: |
          initial-setup.yml will not enable or start a signaling service:
          {{ migration_failure_marker }} exists, so the binary on disk may not
          match the database schema. It says:

          {{ migration_failure_marker_text.content | b64decode }}
      when: migration_failure_marker_file.stat.exists

    - name: Enable signaling services
      systemd:
        name: "p2party-signaling-{{ item }}"
        enabled: true
        daemon_reload: true
      loop: "{{ signaling_instance_ports }}"
      loop_control:
        label: "{{ item }}"

    - name: Report that the binary is not deployed yet
      debug:
        msg: >-
          No binary at {{ app.home }}/server/p2party-server, so the signaling
          units are enabled but not started. Run deploy/deploy.sh to build and
          ship it; that playbook starts and health-checks them.
      when: not signaling_binary.stat.exists

    - name: Start signaling services
      systemd:
        name: "p2party-signaling-{{ item }}"
        state: restarted
      loop: "{{ signaling_instance_ports }}"
      loop_control:
        label: "{{ item }}"
      when: signaling_binary.stat.exists

    - name: Wait for signaling services to be ready
      when: signaling_binary.stat.exists
      block:
        - name: Wait for each instance to accept connections
          wait_for:
            port: "{{ item }}"
            host: 127.0.0.1
            delay: 3
            timeout: 25
          loop: "{{ signaling_instance_ports }}"
          loop_control:
            label: "{{ item }}"
      rescue:
        # A process that exits, or hangs before binding, never opens its port.
        # Without this the play reports only "Timeout", which is the one thing
        # the operator already knows. The service log states the actual cause.
        - name: Collect why the service did not start
          shell: |
            systemctl status p2party-signaling-{{ signaling_instance_ports | first }} --no-pager -l | tail -20
            echo '--- journal ---'
            journalctl -u p2party-signaling-{{ signaling_instance_ports | first }} -n 40 --no-pager
          register: signaling_failure
          changed_when: false
          failed_when: false

        - name: Report the service failure
          fail:
            msg: |
              The signaling service did not start. Its own log follows.

              This playbook restarts whatever binary is already on the host;
              it never ships one. If the log shows a module or startup error
              that you have already fixed in the source, the binary here
              predates that fix — run deploy/deploy.sh to build and ship it.

              Otherwise: COTURN_SECRET missing or under 32 bytes, Postgres
              unreachable or not answering, or a schema this binary was not
              built for. For the database cases the server exits within 10s
              with one "p2party: refusing to start" line rather than hanging.

              {{ signaling_failure.stdout | default('no output captured') }}

    - name: Deployment complete
      debug:
        msg: |
          Signaling server deployed (commit: {{ git_commit.stdout }})!
          - Services: p2party-signaling-[{{ signaling_instance_ports | join(', ') }}]
          - Ports: {{ signaling_instance_ports | join(', ') }}
          - URL: https://signaling.p2party.com

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: true

    # journald re-reads its configuration only on restart. Since systemd 230 it
    # keeps services' stdout streams across a restart in its file descriptor
    # store, so the workers keep logging.
    - name: Restart journald
      systemd:
        name: systemd-journald
        state: restarted
