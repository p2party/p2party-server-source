# ============================================================================
# P2Party WireGuard Setup Playbook
# ============================================================================
# Configures a WireGuard VPN gateway (IP-only endpoint) to access the
# private Hetzner network (10.231.0.0/24) securely.
#
# Usage:
#   ansible-playbook -i inventory/production.yml playbooks/setup-wireguard.yml \
#     --vault-id production@vault_pass_production.sh
# ============================================================================
---
- name: Setup WireGuard VPN Server
  hosts: wireguard_production
  become: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all/vars.yml"
    - "{{ playbook_dir }}/../group_vars/production/vars.yml"
    - "{{ playbook_dir }}/../group_vars/all/vault.yml"

  tasks:
    - name: Display setup info
      debug:
        msg: "Configuring WireGuard on {{ inventory_hostname }} ({{ ansible_host }})"

    - name: Install WireGuard packages
      apt:
        name:
          - wireguard
          - wireguard-tools
          - iptables
        state: present
        update_cache: yes

    - name: Ensure wireguard directory exists
      file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Enable IP forwarding persistently
      copy:
        dest: /etc/sysctl.d/99-wireguard-forwarding.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          net.ipv4.ip_forward=1
      notify: Apply sysctl

    - name: Deploy WireGuard configuration
      template:
        src: "{{ playbook_dir }}/../templates/wg0.conf.j2"
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: '0600'
      notify: Restart WireGuard

    - name: Enable and start WireGuard
      systemd:
        name: wg-quick@wg0
        enabled: true
        state: started

    - name: Verify WireGuard interface exists
      command: wg show wg0
      register: wg_status
      changed_when: false

    - name: WireGuard setup complete
      debug:
        msg: |
          WireGuard configured!
          - Endpoint IP: {{ ansible_host }}
          - Listen UDP port: {{ ports.wireguard | default(51820) }}
          - Private network route: 10.231.0.0/24
          - Interface: wg0

  handlers:
    - name: Apply sysctl
      command: sysctl --system

    - name: Restart WireGuard
      systemd:
        name: wg-quick@wg0
        state: restarted
