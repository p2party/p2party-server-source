# ============================================================================
# P2Party Coturn Setup Playbook
# ============================================================================
# Configures coturn TURN/STUN server with TLS via Let's Encrypt.
# DNS must already point turn.p2party.com and stun.p2party.com to the server's public IP.
#
# Usage:
#   ansible-playbook -i inventory/production.yml playbooks/setup-coturn.yml \
#     --vault-id production@vault_pass_production.sh
# ============================================================================
---
- name: Setup Coturn TURN/STUN Server
  hosts: turn_production
  become: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all/vars.yml"
    - "{{ playbook_dir }}/../group_vars/production/vars.yml"
    - "{{ playbook_dir }}/../group_vars/all/vault.yml"

  tasks:
    - name: Require finite TURN bandwidth budgets
      assert:
        that:
          - coturn_max_bps | default(3000000) | int > 0
          - coturn_bps_capacity | default(30000000) | int >= coturn_max_bps | default(3000000) | int
        fail_msg: Set positive coturn_max_bps and coturn_bps_capacity; zero disables the bandwidth guard

    - name: Display setup info
      debug:
        msg: "Configuring Coturn on {{ inventory_hostname }} ({{ ansible_host }})"

    - name: Ensure coturn is installed
      apt:
        name:
          - coturn
          - certbot
        state: present
        update_cache: yes

    - name: Enable coturn service
      lineinfile:
        path: /etc/default/coturn
        regexp: "^#?TURNSERVER_ENABLED="
        line: "TURNSERVER_ENABLED=1"

    # ========================================================================
    # TLS Certificate via Let's Encrypt
    # ========================================================================
    - name: Stop coturn for certbot standalone
      systemd:
        name: coturn
        state: stopped
      ignore_errors: true

    - name: Check if certificate exists
      stat:
        path: "/etc/letsencrypt/live/{{ vault_coturn_realm }}/fullchain.pem"
      register: cert_exists

    - name: Obtain Let's Encrypt certificate
      command: >
        certbot certonly --standalone
        --non-interactive --agree-tos
        --email {{ vault_admin_email }}
        -d {{ vault_coturn_realm }}
        -d {{ domains.stun | default('stun.p2party.com') }}
      when: not cert_exists.stat.exists

    - name: Create certbot renewal hook for coturn
      copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/coturn.sh
        content: |
          #!/bin/bash
          cp /etc/letsencrypt/live/{{ vault_coturn_realm }}/fullchain.pem /etc/coturn/fullchain.pem
          cp /etc/letsencrypt/live/{{ vault_coturn_realm }}/privkey.pem /etc/coturn/privkey.pem
          chown turnserver:turnserver /etc/coturn/*.pem
          chmod 600 /etc/coturn/*.pem
          systemctl restart coturn
        mode: "0755"

    - name: Create coturn cert directory
      file:
        path: /etc/coturn
        state: directory
        owner: turnserver
        group: turnserver
        mode: "0700"

    - name: Copy certificate for coturn
      copy:
        src: "/etc/letsencrypt/live/{{ vault_coturn_realm }}/fullchain.pem"
        dest: /etc/coturn/fullchain.pem
        owner: turnserver
        group: turnserver
        mode: "0600"
        remote_src: yes

    - name: Copy private key for coturn
      copy:
        src: "/etc/letsencrypt/live/{{ vault_coturn_realm }}/privkey.pem"
        dest: /etc/coturn/privkey.pem
        owner: turnserver
        group: turnserver
        mode: "0600"
        remote_src: yes

    - name: Create turnserver log directory
      file:
        path: /var/log/turnserver
        state: directory
        owner: turnserver
        group: turnserver
        mode: "0750"

    - name: Deploy coturn configuration
      template:
        src: "{{ playbook_dir }}/../templates/turnserver.conf.j2"
        dest: /etc/turnserver.conf
        owner: turnserver
        group: turnserver
        mode: "0600"
      notify: Restart Coturn

    # simple-log writes an unbounded file; without rotation the relay fills its
    # own disk and stops relaying.
    - name: Rotate the coturn log
      copy:
        dest: /etc/logrotate.d/coturn
        mode: "0644"
        content: |
          /var/log/turnserver/turnserver.log {
            daily
            rotate 14
            missingok
            notifempty
            compress
            delaycompress
            copytruncate
            su turnserver turnserver
          }

    - name: Enable and start coturn
      systemd:
        name: coturn
        enabled: true
        state: started

    - name: Setup certbot auto-renewal timer
      systemd:
        name: certbot.timer
        enabled: true
        state: started

    - name: Coturn setup complete
      debug:
        msg: |
          Coturn configured!
          - Realm: {{ vault_coturn_realm }}
          - TLS port: 443
          - STUN port: 3478
          - Relay range: 49152-65535

  handlers:
    - name: Restart Coturn
      systemd:
        name: coturn
        state: restarted
