# ============================================================================
# P2Party Coturn Setup Playbook
# ============================================================================
# Configures coturn TURN/STUN server with TLS via Let's Encrypt.
# DNS must already point turn.p2party.com and stun.p2party.com to the server's public IP.
#
# Usage:
#   ansible-playbook -i inventory/production.yml playbooks/setup-coturn.yml \
#     --vault-id production@vault_pass_production.sh
# ============================================================================
---
# The local pre-flight comes first: it checks this machine's ansible-core and
# Bun before any host is contacted (local-preflight.yml).
- name: Check this machine's toolchain before any host is contacted
  import_playbook: local-preflight.yml

- name: Setup Coturn TURN/STUN Server
  hosts: turn_production
  become: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all/vars.yml"
    - "{{ playbook_dir }}/../group_vars/production/vars.yml"
    - "{{ playbook_dir }}/../group_vars/all/vault.yml"

  tasks:
    - name: Require finite TURN bandwidth budgets
      assert:
        that:
          - coturn_max_bps | default(625000) | int > 0
          - coturn_user_quota | default(12) | int > 0
          - coturn_bps_capacity | default(30000000) | int >= coturn_max_bps | default(625000) | int
          - coturn_max_allocate_lifetime | default(600) | int > 0
          - coturn_max_allocate_lifetime | default(600) | int <= 3600
          # What one credential username can reserve, computed from the same
          # variables and defaults as turnserver.conf.j2, kept to half of the
          # aggregate capacity. coturn counts user-quota per username (the
          # hourly tag) and checks its expiry only on a session's first
          # request (check_stun_auth, src/server/ns_turn_server.c, coturn 4.6.1
          # and master 44fa529). One identity therefore holds at most three
          # tags' quota at once if it stops refreshing, and gains one more
          # tag's quota every lifetime while it keeps refreshing old
          # allocations. This guards against one client's runaway use; it does
          # not bound an adversary, who can also use several identities.
          - 2 * (coturn_user_quota | default(12) | int) * (coturn_max_bps | default(625000) | int) <= coturn_bps_capacity | default(30000000) | int
        fail_msg: >-
          Set positive coturn_max_bps, coturn_user_quota and coturn_bps_capacity
          with coturn_user_quota * coturn_max_bps, what one credential username
          can reserve, at most half of coturn_bps_capacity, and
          coturn_max_allocate_lifetime between 1 and 3600;
          zero disables the bandwidth guard.
          This limits one username, not one identity or an adversary with
          several identities.

    - name: Display setup info
      debug:
        msg: "Configuring Coturn on {{ inventory_hostname }} ({{ ansible_host }})"

    - name: Ensure coturn is installed
      apt:
        name:
          - coturn
          - certbot
        state: present
        update_cache: yes

    - name: Identify directives supported by the currently installed package
      command:
        argv: [dpkg-query, -W, "-f=${Version}", coturn]
      register: coturn_config_package
      changed_when: false

    # A command-line flag in the unit or in /etc/default/coturn overrides
    # turnserver.conf: -l/--log-file or --syslog would restore a log of
    # usernames and client addresses, and -n or a different -c would skip the
    # template altogether. Both files belong to the coturn package, so they are
    # checked rather than rewritten.
    - name: Read the effective coturn unit
      command:
        argv:
          [
            systemctl,
            show,
            coturn.service,
            --property=ExecStart,
            --property=Environment,
          ]
      no_log: true
      register: coturn_unit
      changed_when: false

    - name: Read /etc/default/coturn
      slurp:
        src: /etc/default/coturn
      register: coturn_defaults
      no_log: true

    - name: Refuse coturn command-line flags that override turnserver.conf
      assert:
        that:
          - coturn_override | length == 0
        fail_msg: >-
          coturn has an option that overrides the managed configuration ({{ coturn_override | trim }}).
          Remove it from the service environment or start command before deploying.
      vars:
        coturn_override_pattern: >-
          (?:^|[\s"'=])(?P<flag>--log-file|-l|--syslog|--verbose|--Verbose|--log-binding|-v|-V|-n)(?=[\s"'=;]|$)|(?:^|[\s"'=])(?P<config>-c)(?:\s+|=)(?!/etc/turnserver\.conf(?=[\s"';]|$))
        coturn_override: >-
          {{ (coturn_command_text | regex_search(coturn_override_pattern)) | default('', true) }}
        # Joined with spaces: Ansible keeps '\n' in a Jinja literal as two
        # characters, and the patterns need only whitespace between tokens.
        coturn_command_text: >-
          {{ (coturn_unit.stdout_lines
              + ((coturn_defaults.content | b64decode).splitlines()
                 | reject('match', '^\s*(#|$)') | list)) | join(' ') }}

    - name: Enable coturn service
      lineinfile:
        path: /etc/default/coturn
        regexp: "^#?TURNSERVER_ENABLED="
        line: "TURNSERVER_ENABLED=1"

    # ========================================================================
    # TLS Certificate via Let's Encrypt
    # ========================================================================
    - name: Check if certificate exists
      stat:
        path: "/etc/letsencrypt/live/{{ vault_coturn_realm }}/fullchain.pem"
      register: cert_exists

    - name: Stop coturn for certbot standalone
      systemd:
        name: coturn
        state: stopped
      when: not cert_exists.stat.exists

    - name: Obtain Let's Encrypt certificate
      command: >
        certbot certonly --standalone
        --non-interactive --agree-tos
        --email {{ vault_admin_email }}
        -d {{ vault_coturn_realm }}
        -d {{ domains.stun | default('stun.p2party.com') }}
      when: not cert_exists.stat.exists

    - name: Create certbot renewal hook for coturn
      copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/coturn.sh
        content: |
          #!/bin/bash
          cp /etc/letsencrypt/live/{{ vault_coturn_realm }}/fullchain.pem /etc/coturn/fullchain.pem
          cp /etc/letsencrypt/live/{{ vault_coturn_realm }}/privkey.pem /etc/coturn/privkey.pem
          chown turnserver:turnserver /etc/coturn/*.pem
          chmod 600 /etc/coturn/*.pem
          systemctl restart coturn
        mode: "0755"

    - name: Create coturn cert directory
      file:
        path: /etc/coturn
        state: directory
        owner: turnserver
        group: turnserver
        mode: "0700"

    - name: Copy certificate for coturn
      copy:
        src: "/etc/letsencrypt/live/{{ vault_coturn_realm }}/fullchain.pem"
        dest: /etc/coturn/fullchain.pem
        owner: turnserver
        group: turnserver
        mode: "0600"
        remote_src: yes

    - name: Copy private key for coturn
      copy:
        src: "/etc/letsencrypt/live/{{ vault_coturn_realm }}/privkey.pem"
        dest: /etc/coturn/privkey.pem
        owner: turnserver
        group: turnserver
        mode: "0600"
        remote_src: yes

    # coturn has no configuration check mode, so the rendered file is checked
    # here before it replaces the running one: a candidate that fails these
    # checks fails the play and leaves /etc/turnserver.conf as it was. The
    # candidate holds the TURN shared secret and is removed whatever happens.
    - name: Validate and install the coturn configuration
      block:
        - name: Render the candidate coturn configuration
          vars:
            coturn_legacy_directives: "{{ coturn_config_package.stdout.split('-')[0] is version('4.19.2', '<') }}"
          template:
            src: "{{ playbook_dir }}/../templates/turnserver.conf.j2"
            dest: /etc/turnserver.conf.p2party-candidate
            owner: turnserver
            group: turnserver
            mode: "0600"
          # Keep an operator's --diff from copying the secret into the log.
          diff: false

        - name: Read the candidate coturn configuration
          slurp:
            src: /etc/turnserver.conf.p2party-candidate
          register: coturn_candidate
          no_log: true

        # A failed assertion prints its expression, never the file's contents.
        - name: Validate the candidate coturn configuration
          assert:
            that:
              - coturn_candidate_text is not search('[{][{]|[{]%')
              - coturn_candidate_text is search('^use-auth-secret$', multiline=True)
              - coturn_candidate_text is search('^static-auth-secret=\S{32,}$', multiline=True)
              - coturn_candidate_text is search('^realm=\S+$', multiline=True)
              - coturn_candidate_text is search('^log-file=/dev/null$', multiline=True)
              - coturn_candidate_text is search('^no-stdout-log$', multiline=True)
              - coturn_candidate_text is not search('^(syslog|verbose|Verbose|log-binding)$', multiline=True)
              - coturn_candidate_text is search('^total-quota=[1-9][0-9]*$', multiline=True)
              - coturn_candidate_text is search('^user-quota=[1-9][0-9]*$', multiline=True)
              - coturn_candidate_text is search('^max-bps=[1-9][0-9]*$', multiline=True)
              - coturn_candidate_text is search('^bps-capacity=[1-9][0-9]*$', multiline=True)
              - coturn_candidate_text is search('^max-allocate-lifetime=[1-9][0-9]*$', multiline=True)
            fail_msg: The rendered coturn configuration failed validation; /etc/turnserver.conf is unchanged
            quiet: true
          vars:
            coturn_candidate_text: "{{ coturn_candidate.content | b64decode }}"

        - name: Install the validated coturn configuration
          copy:
            src: /etc/turnserver.conf.p2party-candidate
            dest: /etc/turnserver.conf
            remote_src: true
            owner: turnserver
            group: turnserver
            mode: "0600"
          diff: false
          notify: Restart Coturn
      always:
        - name: Remove the coturn configuration candidate
          file:
            path: /etc/turnserver.conf.p2party-candidate
            state: absent

    # coturn now writes no log (turnserver.conf.j2). Hosts provisioned earlier
    # still hold up to 14 days of rotated files pairing TURN usernames, which
    # then carried identity keys, with client addresses; without their
    # rotation config nothing would ever delete them.
    - name: Remove the coturn file log and its rotation
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/logrotate.d/coturn
        - /var/log/turnserver

    - name: Install the service capability required by the TLS listener
      import_tasks: "{{ playbook_dir }}/../tasks/coturn-service-capability.yml"

    - name: Enable and start coturn
      systemd:
        name: coturn
        enabled: true
        state: started

    - name: Setup certbot auto-renewal timer
      systemd:
        name: certbot.timer
        enabled: true
        state: started

    - name: Apply the validated TURN configuration before upgrading the daemon
      meta: flush_handlers

    - name: Prepare upstream coturn
      import_tasks: "{{ playbook_dir }}/../tasks/prepare-upstream-coturn.yml"

    - name: Activate upstream coturn
      import_tasks: "{{ playbook_dir }}/../tasks/activate-upstream-coturn.yml"

    - name: Coturn setup complete
      debug:
        msg: |
          Coturn configured!
          - Realm: {{ vault_coturn_realm }}
          - TLS port: 443
          - STUN port: 3478
          - Relay range: 49152-65535

  handlers:
    - name: Restart Coturn
      systemd:
        name: coturn
        state: restarted
