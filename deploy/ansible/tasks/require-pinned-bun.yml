# ============================================================================
# Require the pinned Bun on the signaling host
# ============================================================================
# Imported by playbooks/deploy.yml as the first task of "Prepare the release
# without touching the running workers", so a mismatch ends the play in that
# block's rescue: no worker stopped, nothing migrated
# (tests/deploy.contract.test.ts checks the placement). The host's own Bun,
# ~p2party/.bun/bin/bun, installs and runs the migration tooling; it must equal
# bun.version, package.json's packageManager pin. It runs as the app account,
# which owns it.
#
# The binary is not checked here. Nothing staged is ever executed on the host
# (a worker owns the staging directory's parent): deploy.yml compares the
# staged file's SHA-256 with the binary the control machine built, whose build
# record names the Bun that built it.
# ============================================================================
---
- name: Read the Bun version of the signaling host
  command:
    argv:
      - "{{ bun.install_dir }}/bin/bun"
      - --version
  become_user: "{{ app.user }}"
  register: pinned_bun_found
  changed_when: false
  failed_when: false

- name: Require Bun {{ bun.version }} on the signaling host
  assert:
    that:
      - pinned_bun_found.rc == 0
      - (pinned_bun_found.stdout | trim) == bun.version
    fail_msg: >-
      package.json pins Bun {{ bun.version }}, but the signaling host's
      {{ bun.install_dir }}/bin/bun, which installs and runs the migration
      tooling, is {{ pinned_bun_seen }}. No worker has been stopped and nothing
      migrated. Install the pinned release for {{ app.user }}, checking the
      download against the SHA-256 from the release's signed SHASUMS256.txt
      (deploy/README.md, "Which Bun, and where it is checked"), then run
      deploy/deploy.sh again:
      sudo -u {{ app.user }} -H bash -euo pipefail -c 'cd "$(mktemp -d)" &&
      curl -fsSLO https://github.com/oven-sh/bun/releases/download/bun-v{{ bun.version }}/{{ pinned_bun_zip }} &&
      echo "{{ bun.release_sha256[pinned_bun_arch] }}  {{ pinned_bun_zip }}" | sha256sum -c - &&
      unzip -q {{ pinned_bun_zip }} &&
      install -D -m 0755 bun-linux-{{ pinned_bun_arch }}/bun {{ bun.install_dir }}/bin/bun'
  vars:
    pinned_bun_arch: >-
      {{ 'aarch64' if (ansible_facts['architecture'] | default('')) in ['aarch64', 'arm64'] else 'x64' }}
    pinned_bun_zip: bun-linux-{{ pinned_bun_arch }}.zip
    pinned_bun_seen: >-
      {{ ('Bun ' ~ (pinned_bun_found.stdout | trim)) if pinned_bun_found.rc == 0
         else ('no Bun (' ~ ((pinned_bun_found.msg | default('')) ~ ' ' ~ (pinned_bun_found.stderr | default(''))) | trim ~ ')') }}
