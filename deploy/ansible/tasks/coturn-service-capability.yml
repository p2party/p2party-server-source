---
# The packaged service runs as turnserver. Port 443 needs this capability
# regardless of the host's unprivileged-port sysctl or the binary's inode.
- name: Create the TURN systemd drop-in directory
  file:
    path: /etc/systemd/system/coturn.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Allow the service account to bind its configured TLS port
  copy:
    dest: /etc/systemd/system/coturn.service.d/20-p2party-tls-port.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      AmbientCapabilities=CAP_NET_BIND_SERVICE
  register: coturn_service_capability

- name: Load the TURN capability before starting the service
  systemd:
    daemon_reload: true
  when: coturn_service_capability.changed
