# ============================================================================
# P2Party Ansible Configuration
# ============================================================================

[defaults]
inventory = inventory/production.yml
remote_user = p2party
private_key_file = ~/.ssh/operator_key_1
vault_identity_list = production@vault_pass_production.sh
host_key_checking = True
retry_files_enabled = False
timeout = 30
forks = 10

# Logging
log_path = /tmp/p2party-ansible.log

# Callback plugins
stdout_callback = ansible.builtin.default
result_format = yaml
callbacks_enabled = profile_tasks, timer

# Become settings
become = False
become_method = sudo
become_user = root

# SSH connection settings
[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=no
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
retries = 3
timeout = 30

[privilege_escalation]
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[colors]
highlight = bright blue
verbose = bright cyan
warn = bright yellow
error = bright red
debug = dark gray
ok = green
changed = bright yellow
skip = bright cyan
diff_add = green
diff_remove = red
diff_lines = cyan
