# ============================================================================
# P2Party Production Environment Variables
# ============================================================================

deployment_environment: production
env_name: prod

# One process is the production correctness boundary until cross-worker
# same-identity session and room-mutation fencing are implemented. The server's
# LISTEN/NOTIFY multi-worker path remains available as an explicit opt-in.
signaling_ports: [3001]

app:
  user: p2party
  group: p2party
  home: /home/p2party
  node_env: production

domains:
  main: p2party.com
  signaling: signaling.p2party.com
  turn: turn.p2party.com
  stun: stun.p2party.com

database:
  host: "{{ network.postgres }}"
  port: "{{ ports.postgres }}"
  name: "{{ vault_postgres_db_name }}"
  user: "{{ vault_postgres_user }}"
  password: "{{ vault_postgres_password }}"
  # postgres-tls.yml provisions a CA and a leaf with the private IP in its SAN,
  # then distributes only the public CA certificate over authenticated SSH.
  ssl_mode: verify-full
  ssl_root_cert: /etc/p2party/postgres-ca.crt
  # Server-side ceiling, set by install-postgres.yml.
  max_connections: 100
  # Per-Prisma-instance pool. Keep (explicit signaling_ports x connection_limit)
  # comfortably under max_connections above when experimentally opting into
  # multiple workers, or a restart storm can exhaust the server's slots.
  connection_limit: 10

# Shared by the worker and Prisma. Jinja's urlencode leaves '/' unescaped.
postgres_connection_url: "postgresql://{{ database.user | urlencode | replace('/', '%2F') }}:{{ database.password | urlencode | replace('/', '%2F') }}@{{ database.host }}:{{ database.port }}/{{ database.name | urlencode | replace('/', '%2F') }}?schema=public&sslmode={{ database.ssl_mode }}&sslrootcert={{ database.ssl_root_cert | urlencode }}"

logging:
  level: info
  log_retention_days: 30
  log_max_size: 500M
