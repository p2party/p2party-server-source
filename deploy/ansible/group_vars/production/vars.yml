# ============================================================================
# P2Party Production Environment Variables
# ============================================================================

deployment_environment: production
env_name: prod

# One process is the production correctness boundary until cross-worker
# same-identity session and room-mutation fencing are implemented. The server's
# LISTEN/NOTIFY multi-worker path remains available as an explicit opt-in.
signaling_ports: [3001]

app:
  user: p2party
  group: p2party
  home: /home/p2party
  node_env: production

domains:
  main: p2party.com
  signaling: signaling.p2party.com
  turn: turn.p2party.com
  stun: stun.p2party.com

database:
  host: "{{ network.postgres }}"
  port: "{{ ports.postgres }}"
  name: "{{ vault_postgres_db_name }}"
  user: "{{ vault_postgres_user }}"
  password: "{{ vault_postgres_password }}"
  # node-postgres does not implement libpq sslmode semantics, so this value is
  # only a hint: src/db/ssl.ts makes the actual decision and passes an explicit
  # ssl option. 'require' here means encrypt; verification needs sslrootcert
  # pointing at the CA that signed the server certificate, which Debian's
  # install-time self-signed certificate cannot satisfy (its SAN does not cover
  # 10.231.0.2). Encrypted-but-unverified stops passive capture on the private
  # network; it does not stop an active in-path attacker. Issuing a real
  # certificate and adding sslrootcert is the remaining step and needs no code
  # change.
  ssl_mode: require
  # Server-side ceiling, set by install-postgres.yml.
  max_connections: 100
  # Per-Prisma-instance pool. Keep (explicit signaling_ports x connection_limit)
  # comfortably under max_connections above when experimentally opting into
  # multiple workers, or a restart storm can exhaust the server's slots.
  connection_limit: 10

logging:
  level: info
  log_retention_days: 30
  log_max_size: 500M
