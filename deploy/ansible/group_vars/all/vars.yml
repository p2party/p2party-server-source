# ============================================================================
# P2Party Group Variables - All Hosts
# ============================================================================

# ------------------------------------------------------------------------------
# System Configuration
# ------------------------------------------------------------------------------
timezone: UTC
locale: en_US.UTF-8

# ------------------------------------------------------------------------------
# Security Configuration
# ------------------------------------------------------------------------------
security:
  ssh_permit_root_login: "no"
  ssh_password_authentication: "no"
  ssh_max_auth_tries: 3
  ssh_client_alive_interval: 300
  ssh_client_alive_count_max: 2
  ufw_default_incoming: deny
  ufw_default_outgoing: allow
  fail2ban_bantime: 3600
  fail2ban_findtime: 600
  fail2ban_maxretry: 3

# ------------------------------------------------------------------------------
# User Configuration
# ------------------------------------------------------------------------------
users:
  - name: p2party
    groups:
      - sudo
    shell: /bin/bash
    state: present

# ------------------------------------------------------------------------------
# Network Configuration
# ------------------------------------------------------------------------------
network:
  range: 10.231.0.0/24
  postgres: 10.231.0.2
  coturn: 10.231.0.3
  signaling: 10.231.0.4
  wireguard: 10.231.0.5
  postgres_ip: 10.231.0.2

# ------------------------------------------------------------------------------
# Service Ports
# ------------------------------------------------------------------------------
ports:
  postgres: 5432
  signaling: 3001
  coturn: 443
  coturn_stun: 3478
  wireguard: 51820

# The `database:` block lives in group_vars/production/vars.yml, which loads
# after this file and would override anything defined here. Environment-specific
# connection details belong there, not in the shared defaults.

# ------------------------------------------------------------------------------
# Application Configuration
# ------------------------------------------------------------------------------
app:
  user: p2party
  group: p2party
  home: /home/p2party
  node_env: production

# The release build (playbooks/deploy.yml). The binary is built on the control
# machine from this repository by `bun run build:linux` into
# deploy/ansible/builds/, beside the playbook that ships it, with its build
# record next to it.
repo_path: "{{ playbook_dir }}/../../.."
build_command: "bun run build:linux"
binary_name: deploy/ansible/builds/p2party_linux_x64

# The ansible-core these playbooks were tested with. playbooks/local-preflight.yml,
# the first play of every playbook, accepts this patch release or a later one of
# the same minor line (for 2.22.0: at least 2.22.0, below 2.23).
ansible_core_tested: "2.22.0"

# Bun runtime. `version` is read from package.json's packageManager, the one
# place the pin is written; CI's setup-bun reads it from there too.
# local-preflight.yml requires it on the control machine, whose Bun
# `bun build --compile` embeds in the binary; deploy.yml requires the binary's
# build record to name it and the signaling host's own Bun to equal it
# (tasks/require-pinned-bun.yml). `release_sha256` holds, per Bun version, the
# SHA-256 of that release's Linux zips from its signed SHASUMS256.txt, for the
# install command the host check prints. A pin without an entry here fails
# the pre-flight and tests/deploy.contract.test.ts (deploy/README.md, "Which
# Bun, and where it is checked").
bun:
  version: >-
    {{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../../package.json')
        | from_json).packageManager | regex_replace('^bun@', '') }}
  install_dir: "/opt/p2party-bun/{{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../../package.json') | from_json).packageManager | regex_replace('^bun@', '') }}"
  release_sha256:
    "1.4.5":
      x64: 94559b3b528995a49452f9f2404cec74f2efd7d06e0a000a8cd214b02c3666eb
      aarch64: 18656a3bf0ea5641f5796ae4213b75255579a70a0fded2f337933785568cdf84

# ------------------------------------------------------------------------------
# Logging Configuration
# ------------------------------------------------------------------------------
logging:
  log_retention_days: 14
  log_max_size: 100M
