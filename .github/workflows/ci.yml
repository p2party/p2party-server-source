name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/p2party_ci?schema=public&sslmode=disable"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Start native PostgreSQL
        run: |
          # Keep bootstrap safe to rerun on the same runner: systemctl and ALTER
          # USER are idempotent, and createdb is called only when the DB is absent.
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set=ON_ERROR_STOP=1 \
            --command="ALTER USER postgres PASSWORD 'postgres';"
          if ! sudo -u postgres psql --tuples-only --no-align \
            --command="SELECT 1 FROM pg_database WHERE datname = 'p2party_ci';" \
            | grep --quiet '^1$'; then
            sudo -u postgres createdb --owner=postgres p2party_ci
          fi
      - name: Generate Prisma client
        run: bun run db:generate
      - name: Apply PostgreSQL migrations
        # `migrate deploy` applies only pending migrations, so retries are safe.
        run: bun run db:migrate
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Check formatting
        run: bun run format:check
